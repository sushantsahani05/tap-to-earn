<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap to Earn Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #18191c; color: #ffffff; text-align: center; padding: 20px; }
    button { background: #0088cc; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 8px; margin: 10px 0; width: 100%; cursor: pointer; font-weight: bold; }
    button:disabled { background: #444; }
    .card { background: #232529; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Points: <span id="points">0</span></h1>
    <h3>Energy: <span id="charges">0</span> / <span id="maxCharges">1000</span></h3>
    <button id="tapBtn">⚡ Tap to Earn</button>
  </div>

  <div class="card">
    <h3>Monetization & Rewards</h3>
    <button id="adBtn">📺 Watch Ad (+1,000,000 Points)</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    const userId = tg?.initDataUnsafe?.user?.id || "demo-user";
    const urlParams = new URLSearchParams(window.location.search);
    const referralCode = urlParams.get('ref') || "";

    // Adsgram initialization using your UnitID
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "bot-50240" }) : null;

    async function fetchUser() {
      try {
        const res = await fetch('/api/user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, referralCode })
        });
        const user = await res.json();
        updateUI(user);
      } catch (err) {
        console.error("Error fetching user data:", err);
      }
    }

    function updateUI(user) {
      document.getElementById('points').innerText = user.points.toLocaleString();
      document.getElementById('charges').innerText = user.charges;
      document.getElementById('maxCharges').innerText = user.maxCharges;
    }

    document.getElementById('tapBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });
        if (res.ok) {
          const user = await res.json();
          updateUI(user);
        }
      } catch (err) {
        console.error("Tap error:", err);
      }
    });

    document.getElementById('adBtn').addEventListener('click', () => {
      if (!AdController) {
        alert("Adsgram SDK failed to load.");
        return;
      }

      AdController.show()
        .then((result) => {
          alert("Ad completed! Points will reflect shortly.");
          setTimeout(fetchUser, 2000);
        })
        .catch((result) => {
          console.log("Ad skipped or failed:", result);
        });
    });

    fetchUser();
  </script>
</body>
</html>
